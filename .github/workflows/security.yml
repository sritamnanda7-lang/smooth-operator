# SPDX-License-Identifier: FSL-1.1-MIT
# Dependency audit: cargo-audit, cargo-deny and bun audit (root and desktop lockfiles).
# Ignores live in desktop/src-tauri/deny.toml and .cargo/audit.toml (each with a reason).
name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: cargo audit
        working-directory: desktop/src-tauri
        run: cargo audit

      - name: cargo deny
        working-directory: desktop/src-tauri
        run: cargo deny check

      - name: bun audit (repo root)
        run: bun audit

      # GHSA-g3hv-75wg-m249: minimatch DoS in eslint tooling (dev only, never shipped,
      # input is our own lint globs). Revisit when typescript-eslint moves to minimatch 11.
      - name: bun audit (desktop)
        working-directory: desktop
        run: bun audit --ignore=GHSA-g3hv-75wg-m249
